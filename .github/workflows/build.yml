name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-tier1:
    name: build (Ubuntu 26.04, Lyrical Tier 1)
    uses: NCKU-custos/custos-infra/.github/workflows/ros2-build.yml@main
    with:
      ros_distro: lyrical
      ubuntu_version: "26.04"

  # Tier 3 (Ubuntu 24.04 fallback) deferred per ADR 0011 open-follow-up #8:
  # it needs a sibling ros-base:lyrical-24.04 image (not built yet), and
  # continue-on-error is not permitted on a reusable-workflow caller job, so a
  # non-blocking matrix entry can't be expressed here. Re-add when Tier 3 is
  # un-deferred and the 24.04 base image exists.

  lint:
    uses: NCKU-custos/custos-infra/.github/workflows/lint.yml@main

  consumers:
    name: pre-merge consumer build
    if: github.event_name == 'pull_request'
    needs: build-tier1
    uses: NCKU-custos/custos-infra/.github/workflows/interfaces-consumers.yml@main
    with:
      interfaces_ref: ${{ github.event.pull_request.head.sha }}
    secrets:
      CUSTOS_CI_APP_ID: ${{ secrets.CUSTOS_CI_APP_ID }}
      CUSTOS_CI_PRIVATE_KEY: ${{ secrets.CUSTOS_CI_PRIVATE_KEY }}
